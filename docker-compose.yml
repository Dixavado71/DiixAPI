version: '3.8'

services:
  ecms6-postgres:
    image: postgres:16-alpine
    container_name: ecms6-postgres
    environment:
      POSTGRES_USER: ecms6
      POSTGRES_PASSWORD: ecms6password
      POSTGRES_DB: ecms6
    ports:
      - "5432:5432"
    volumes:
      - ecms6_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecms6"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecms6-network

  ecms6-redis:
    image: redis:7-alpine
    container_name: ecms6-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ecms6_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecms6-network

volumes:
  ecms6_postgres_data:
  ecms6_redis_data:

networks:
  ecms6-network:
    driver: bridge
